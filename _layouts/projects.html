---
layout: default
---

<div class="grid justify-center post-content">
<div id="content" class="min-w-0">
    <div id="post">
        <div class="post-header">
            <h1>{{ page.title }}</h1>
            <div id="tags">
                {% for tag in page.categories %}
                  <a href="{{ site.baseurl }}/categories#{{ tag | slugify }}" class="text-base mr-1 text-primary-100 tag">#{{ tag }}</a>
                {% endfor %}
            </div>
        </div>
        <div class="post-image">
  <img src="{{ page.image }}" alt="{{ page.imageDescription }}" class="w-full pb-8">
        </div>
        <div class="border-b-1 border-(--bg-300) my-8"></div>
        <div class="post-body">
            {{ content }}
        </div>
        <div class="post-footer"></div>
    </div>
</div>
</div>
